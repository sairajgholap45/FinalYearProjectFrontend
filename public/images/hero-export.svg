<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Global export hero backdrop</title>
  <desc id="desc">Decorative abstract background representing shipping and trade routes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08122f" />
      <stop offset="100%" stop-color="#1f3f7a" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="75%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#f4bc23" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#f4bc23" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect width="1600" height="1000" fill="url(#goldGlow)" />
  <g opacity="0.32" stroke="#dfe7ff" fill="none">
