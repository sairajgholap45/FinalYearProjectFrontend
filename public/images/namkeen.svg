<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b6f47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5d5a3d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowN">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradN)"/>
  <!-- White ceramic bowl -->
  <ellipse cx="200" cy="200" rx="95" ry="65" fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  <ellipse cx="200" cy="195" rx="90" ry="60" fill="#ffffff" opacity="0.9"/>
  <g filter="url(#shadowN)">
    <!-- Samosas -->
    <polygon points="140,170 165,155 172,210 140,200" fill="#d4a574" stroke="#8b7355" stroke-width="1.5"/>
    <polygon points="260,175 285,160 292,215 265,205" fill="#c87a3a" stroke="#8b7355" stroke-width="1.5"/>
    <!-- Namkeen mix (spirals and shapes) -->
    <circle cx="160" cy="210" r="9" fill="#f4d03f" opacity="0.8"/>
    <circle cx="200" cy="195" r="8" fill="#d4a574"/>
    <path d="M 230 205 Q 235 195 240 205" fill="#e8a647" stroke="#8b7355" stroke-width="1"/>
    <circle cx="180" cy="225" r="8" fill="#f4d03f" opacity="0.7"/>
    <polygon points="220,220 228,215 232,225" fill="#d4a574"/>
    <!-- Sev/noodles -->
    <path d="M 170 240 Q 175 235 180 240" stroke="#d4a574" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 220 235 Q 225 230 230 235" stroke="#e8a647" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="225" r="9" fill="#c87a3a" opacity="0.8"/>
  </g>
  <rect x="0" y="340" width="400" height="60" fill="rgba(93, 90, 61, 0.95)"/>
  <text x="200" y="378" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff" font-family="Arial">Namkeen & Snacks</text>
</svg>