<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradJ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowJ">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradJ)"/>
  <g filter="url(#shadowJ)">
    <!-- Gold Necklace -->
    <path d="M 90 120 Q 130 70 200 70 Q 270 70 310 120" fill="none" stroke="#f4bc23" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="200" cy="150" r="32" fill="#ffd700" stroke="#d4a017" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Pendant details -->
    <circle cx="200" cy="150" r="20" fill="#f4bc23" opacity="0.8"/>
    <!-- Chain dots -->
    <circle cx="120" cy="105" r="4" fill="#f4bc23" opacity="0.9" filter="url(#glow)"/>
    <circle cx="280" cy="105" r="4" fill="#f4bc23" opacity="0.9" filter="url(#glow)"/>
    
    <!-- Earrings -->
    <circle cx="130" cy="90" r="7" fill="#ffd700" stroke="#d4a017" stroke-width="1" filter="url(#glow)"/>
    <circle cx="270" cy="90" r="7" fill="#ffd700" stroke="#d4a017" stroke-width="1" filter="url(#glow)"/>
    <ellipse cx="130" cy="115" rx="5" ry="8" fill="#f4bc23" opacity="0.8"/>
    <ellipse cx="270" cy="115" rx="5" ry="8" fill="#f4bc23" opacity="0.8"/>
    
    <!-- Bracelet -->
    <path d="M 100 270 Q 100 230 150 220 Q 200 210 250 220 Q 300 230 300 270" fill="none" stroke="#ffd700" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Bracelet beads -->
    <circle cx="120" cy="250" r="5" fill="#f4bc23" opacity="0.9"/>
    <circle cx="150" cy="225" r="5" fill="#ffd700" opacity="0.9"/>
    <circle cx="200" cy="212" r="5" fill="#f4bc23" opacity="0.9"/>
    <circle cx="250" cy="225" r="5" fill="#ffd700" opacity="0.9"/>
    
    <!-- Ring -->
    <circle cx="310" cy="280" r="16" fill="none" stroke="#ffd700" stroke-width="8" filter="url(#glow)"/>
    <polygon points="310,270 314,278 306,278" fill="#f4bc23" opacity="0.8"/>
  </g>
  <rect x="0" y="340" width="400" height="60" fill="rgba(45, 45, 45, 0.95)"/>
  <text x="200" y="378" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff" font-family="Arial">Imitation Jewellery</text>
</svg>