<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4b896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0826d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowD">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradD)"/>
  <!-- Wooden bowl -->
  <ellipse cx="200" cy="220" rx="110" ry="70" fill="#8b6f47" stroke="#6b5437" stroke-width="2"/>
  <ellipse cx="200" cy="220" rx="100" ry="60" fill="#a0826d"/>
  <ellipse cx="200" cy="215" rx="95" ry="55" fill="#b8956a" opacity="0.7"/>
  <g filter="url(#shadowD)">
    <!-- Cashews -->
    <path d="M 120 200 Q 110 185 130 175 Q 150 180 145 200" fill="#d4a574" stroke="#8b7355" stroke-width="1"/>
    <path d="M 160 190 Q 150 175 170 165 Q 190 170 185 195" fill="#c4845c" stroke="#8b7355" stroke-width="1"/>
    <!-- Almonds -->
    <ellipse cx="240" cy="180" rx="16" ry="24" fill="#d4a574" stroke="#8b7355" stroke-width="1" opacity="0.9"/>
    <ellipse cx="270" cy="195" rx="15" ry="22" fill="#c4845c" stroke="#8b7355" stroke-width="1"/>
    <!-- Raisins -->
    <circle cx="180" cy="240" r="10" fill="#4a2c2a"/>
    <circle cx="210" cy="235" r="10" fill="#5c3a38"/>
    <circle cx="240" cy="245" r="9" fill="#4a2c2a"/>
    <!-- Walnuts -->
    <circle cx="300" cy="210" r="22" fill="#7d6644" stroke="#5d5a3d" stroke-width="1"/>
    <path d="M 290 210 Q 300 202 310 210" fill="#5d5a3d" stroke-width="0.5" opacity="0.6"/>
    <!-- Dried apricots -->
    <circle cx="150" cy="260" r="12" fill="#da8c3a"/>
    <circle cx="280" cy="260" r="11" fill="#c07030"/>
  </g>
  <rect x="0" y="340" width="400" height="60" fill="rgba(139, 111, 71, 0.95)"/>
  <text x="200" y="378" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="Arial">Dry Fruits & Nuts</text>
</svg>