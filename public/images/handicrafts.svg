<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowH">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGradH)"/>
  <g filter="url(#shadowH)">
    <!-- Blue red decorative bowl front -->
    <ellipse cx="110" cy="200" rx="60" ry="45" fill="#004d99" stroke="#003d7a" stroke-width="2"/>
    <ellipse cx="110" cy="195" rx="55" ry="40" fill="#0066cc" opacity="0.9"/>
    <!-- Gold decorative pattern on bowl -->
    <circle cx="95" cy="190" r="4" fill="#f4bc23" opacity="0.7"/>
    <circle cx="125" cy="195" r="3" fill="#f4bc23" opacity="0.6"/>
    <circle cx="100" cy="215" r="3" fill="#ffd700" opacity="0.7"/>
    
    <!-- Red-gold patterned bowl back -->
    <ellipse cx="280" cy="180" rx="65" ry="50" fill="#c41e3a" stroke="#8b0000" stroke-width="2"/>
    <ellipse cx="280" cy="175" rx="60" ry="45" fill="#e63946" opacity="0.9"/>
    <!-- Gold patterns -->
    <circle cx="260" cy="170" r="5" fill="#ffd700" opacity="0.8"/>
    <circle cx="290" cy="165" r="5" fill="#f4bc23" opacity="0.7"/>
    <circle cx="300" cy="185" r="4" fill="#ffd700" opacity="0.7"/>
    <circle cx="270" cy="195" r="4" fill="#f4bc23" opacity="0.6"/>
    
    <!-- Turquoise-gold plate/bowl middle -->
    <ellipse cx="200" cy="280" rx="70" ry="50" fill="#2d9cca" stroke="#1e7a8c" stroke-width="2"/>
    <ellipse cx="200" cy="275" rx="65" ry="45" fill="#3db5e0" opacity="0.9"/>
    <!-- Pattern elements -->
    <path d="M 170 270 Q 180 265 190 270" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <path d="M 210 270 Q 220 265 230 270" fill="none" stroke="#f4bc23" stroke-width="2" stroke-linecap="round"/>
    <circle cx="175" cy="290" r="3" fill="#f4bc23" opacity="0.8"/>
    <circle cx="225" cy="290" r="3" fill="#ffd700" opacity="0.8"/>
  </g>
  <rect x="0" y="340" width="400" height="60" fill="rgba(45, 45, 45, 0.95)"/>
  <text x="200" y="378" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" font-family="Arial">Handicrafts</text>
</svg>